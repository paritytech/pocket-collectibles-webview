# Builds the webview and deploys it to Polkadot Bulletin storage via the
# paritytech/polkadot-app-deploy reusable workflow.
#
#   pull request  → collectibles-webview-pr<N>-preview00.dot on devnet
#   push to main  → collectibles-webview.dot on devnet AND paseo-next-v2
#
# The reusable-workflow ref (@v0.13.1) and polkadot-app-deploy-version are
# pinned to the same release — bump them together.
name: Deploy to Polkadot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per ref on main). Superseded PR runs are cancelled;
# production runs queue instead, so an in-flight chain deploy is never
# killed partway through.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: collectibles-webview-build
          path: dist
          retention-days: 1

  # PR previews deploy to devnet (Paseo system chains) on a throwaway
  # subdomain per PR, and post the preview URL as a sticky PR comment.
  deploy-preview:
    name: Deploy preview
    needs: [typecheck, build]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # sticky PR comment with the preview URL
    uses: paritytech/polkadot-app-deploy/.github/workflows/deploy.yml@v0.13.1
    with:
      artifact-name: collectibles-webview-build
      dotns-domain: collectibles-webview-pr${{ github.event.pull_request.number }}-preview00.dot
      comment-on-pr: true
      env: devnet
      gateway: dev-dot.li
      skip-cache: true
      max-retries: 10
      polkadot-app-deploy-version: "0.13.1"
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}

  # Production (push to main / manual dispatch) publishes
  # collectibles-webview.dot to BOTH networks: devnet and paseo-next-v2.
  # Each matrix leg is an independent reusable-workflow call; fail-fast:
  # false so one network's failure doesn't cancel the other.
  #
  # skip-cache: true is REQUIRED here. The reusable workflow keys its deploy
  # cache on the build-content hash only (no env/network), so with caching
  # on, whichever leg finishes first would populate the cache and the other
  # network's leg would cache-hit and SKIP its deploy entirely — never
  # publishing to that network. Forcing skip-cache makes both legs always
  # deploy. (Tradeoff: every push to main redeploys both networks even when
  # the build content is unchanged.)
  deploy-production:
    name: Deploy production (${{ matrix.env }})
    needs: [typecheck, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: devnet
            gateway: dev-dot.li
          - env: paseo-next-v2
            gateway: paseo.li
    uses: paritytech/polkadot-app-deploy/.github/workflows/deploy.yml@v0.13.1
    with:
      artifact-name: collectibles-webview-build
      dotns-domain: collectibles-webview.dot
      env: ${{ matrix.env }}
      gateway: ${{ matrix.gateway }}
      skip-cache: true
      max-retries: 10
      polkadot-app-deploy-version: "0.13.1"
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC }}
